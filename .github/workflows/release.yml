name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for a tag pushed before this workflow existed — omit to use the tag that triggered this run)"
        required: false
      notes:
        description: "Release notes body (Markdown). Leave empty to auto-generate from the commit log."
        required: false

permissions:
  contents: write

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag being released
        id: tag
        run: |
          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # A tag is a promise this commit actually builds and passes its own
      # tests — checked here rather than assumed, since this can also be
      # triggered by hand for a tag pushed before this workflow existed.
      - name: Verify the tagged commit builds and passes tests
        run: ./gradlew --no-daemon build

      # Idempotent: creates the release if it doesn't exist yet, otherwise
      # edits it in place — this workflow has no other way to fix a
      # release's notes after the fact (there's no separate "edit" trigger).
      # Notes go through a file, not inline in the shell command: an
      # inputs.notes value substituted directly into `run:` breaks the
      # moment it contains a quote, backtick, or (being Markdown) a
      # multi-line body — exactly what a real set of release notes is.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if [ -n "$NOTES" ]; then
            printf '%s' "$NOTES" > /tmp/release-notes.md
            notes_flags=(--notes-file /tmp/release-notes.md)
          else
            notes_flags=(--generate-notes)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" "${notes_flags[@]}"
          else
            gh release create "$tag" --title "$tag" "${notes_flags[@]}"
          fi
